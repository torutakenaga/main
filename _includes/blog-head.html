{%- comment -%}ブログ(一覧・記事)共通の head。ホームと同じ配色・フォント。外部スクリプトなし。{%- endcomment -%}
{%- assign pg_title = page.title | default: "Blog" -%}
{%- assign pg_desc = page.description | default: site.description -%}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ pg_title }} — Toru Takenaga</title>
<meta name="description" content="{{ pg_desc | strip_html | strip_newlines | escape }}">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="alternate" type="application/atom+xml" title="Toru Takenaga" href="/feed.xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:site_name" content="Toru Takenaga">
<meta property="og:title" content="{{ pg_title | escape }}">
<meta property="og:description" content="{{ pg_desc | strip_html | strip_newlines | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="https://torutakenaga.com/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Geist+Mono:wght@300;400&family=Geist:wght@300;400;500&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #F7F5F0;
  --bg2:     #EFECE5;
  --rule:    rgba(24,23,15,0.1);
  --ink:     #18170F;
  --ink2:    #6A6860;
  --ink3:    #A9A69E;
  --tango:   #B83040;
  --kendo:   #3A4A5C;
  --science: #1F5C3E;
  --f-serif: 'Cormorant Garamond', Georgia, serif;
  --f-mono:  'Geist Mono', monospace;
  --f-sans:  'Geist', 'Noto Sans JP', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-sans); font-size: 14px; font-weight: 300;
  line-height: 1.65; -webkit-font-smoothing: antialiased;
}
a { color: inherit; }

/* NAV (ホームと同じ) */
nav {
  position: sticky; top: 0; z-index: 99;
  background: var(--bg); border-bottom: 1px solid var(--rule);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 48px; height: 48px;
}
.nav-logo {
  font-family: var(--f-serif); font-size: 18px; font-weight: 400;
  font-style: italic; color: var(--ink); text-decoration: none;
}
.nav-links { display: flex; gap: 24px; list-style: none; }
.nav-links a {
  font-family: var(--f-mono); font-size: 10px; font-weight: 300;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink3); text-decoration: none; transition: color 0.2s;
}
.nav-links a:hover, .nav-links a.current { color: var(--ink); }

/* PAGE */
.wrap { max-width: 640px; margin: 0 auto; padding: 64px 48px 48px; }
.kicker {
  font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--ink3); margin-bottom: 14px;
}
h1.page-title {
  font-family: var(--f-serif); font-size: 44px; font-weight: 300;
  line-height: 1.15; margin-bottom: 10px;
}
.lede { color: var(--ink2); font-size: 15px; margin-bottom: 40px; }
.meta {
  font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.08em;
  color: var(--ink3); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
}
.pill {
  font-family: var(--f-mono); font-size: 9px; letter-spacing: 0.08em;
  text-transform: uppercase; padding: 3px 8px; border-radius: 2px; border: 1px solid;
}
.pill-research { color: var(--science); border-color: rgba(31,92,62,0.25); background: rgba(31,92,62,0.04); }
.pill-tango    { color: var(--tango);   border-color: rgba(184,48,64,0.25); background: rgba(184,48,64,0.04); }
.pill-kendo    { color: var(--kendo);   border-color: rgba(58,74,92,0.25);  background: rgba(58,74,92,0.04); }
.pill-other    { color: var(--ink2);    border-color: var(--rule); }

/* INDEX */
.post-list { list-style: none; border-top: 1px solid var(--rule); }
.post-item { padding: 24px 0; border-bottom: 1px solid var(--rule); }
.post-item h2 {
  font-family: var(--f-serif); font-size: 26px; font-weight: 400;
  line-height: 1.25; margin: 8px 0 6px;
}
.post-item h2 a { text-decoration: none; }
.post-item h2 a:hover { text-decoration: underline; text-underline-offset: 3px; }
.post-item p { color: var(--ink2); }
.empty { color: var(--ink3); font-family: var(--f-mono); font-size: 11px; padding: 28px 0; border-top: 1px solid var(--rule); }

/* POST */
.post-head { margin-bottom: 36px; padding-bottom: 24px; border-bottom: 1px solid var(--rule); }
.post-head h1 {
  font-family: var(--f-serif); font-size: 42px; font-weight: 400;
  line-height: 1.2; margin: 10px 0 14px;
}
.tldr {
  background: var(--bg2); border-left: 2px solid var(--ink3);
  padding: 14px 18px; margin-bottom: 36px; color: var(--ink2);
}
.tldr b { font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.1em; color: var(--ink); margin-right: 8px; }
.prose { font-size: 15px; line-height: 1.9; }
.prose > * + * { margin-top: 1.1em; }
.prose h2 {
  font-family: var(--f-serif); font-size: 28px; font-weight: 400; line-height: 1.3;
  margin-top: 2em; padding-bottom: 6px; border-bottom: 1px solid var(--rule);
}
.prose h3 { font-size: 16px; font-weight: 500; margin-top: 1.6em; }
.prose a { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--ink3); }
.prose ul, .prose ol { padding-left: 1.4em; }
.prose li + li { margin-top: 0.3em; }
.prose blockquote { border-left: 2px solid var(--rule); padding-left: 16px; color: var(--ink2); }
.prose img { max-width: 100%; height: auto; display: block; }
.prose figure { margin: 1.6em 0; }
.prose figcaption, .prose em.caption { font-size: 12px; color: var(--ink3); margin-top: 6px; }
.prose code { font-family: var(--f-mono); font-size: 0.86em; background: var(--bg2); padding: 1px 5px; border-radius: 2px; }
.prose pre { background: var(--bg2); padding: 14px 16px; overflow-x: auto; border-radius: 2px; }
.prose pre code { background: none; padding: 0; font-size: 12px; line-height: 1.6; }
.prose table { border-collapse: collapse; width: 100%; font-size: 13px; display: block; overflow-x: auto; }
.prose th, .prose td { border-bottom: 1px solid var(--rule); padding: 8px 10px; text-align: left; vertical-align: top; }
.prose th { font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink3); font-weight: 400; }
.prose hr { border: 0; border-top: 1px solid var(--rule); }
.prose .footnotes { font-size: 12px; color: var(--ink2); }
.pager { display: flex; justify-content: space-between; gap: 16px; margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--rule); font-size: 13px; }
.pager a { text-decoration: none; color: var(--ink2); }
.pager a:hover { color: var(--ink); }
.back { display: inline-block; margin-top: 28px; font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink3); text-decoration: none; }
.back:hover { color: var(--ink); }

footer {
  border-top: 1px solid var(--rule); padding: 18px 48px;
  max-width: 1080px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  font-family: var(--f-mono); font-size: 10px; color: var(--ink3);
}
footer a { text-decoration: none; }
footer a:hover { color: var(--ink); }

@media (max-width: 640px) {
  nav { padding: 0 20px; }
  .nav-links { gap: 10px; }
  .nav-links a { font-size: 9px; letter-spacing: 0.06em; }
  .nav-logo { font-size: 16px; white-space: nowrap; }
  .wrap { padding: 40px 20px 32px; }
  h1.page-title { font-size: 36px; }
  .post-head h1 { font-size: 32px; }
  footer { padding: 18px 20px; }
}
</style>
