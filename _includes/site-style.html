{%- comment -%}
  サイト全体(ホーム・ブログ)の共通スタイル。
  文字サイズは3種類だけ: --s(注記) / --m(本文) / --l(見出し)。色は白・黒・灰色、リンクと現在地だけ緑。
{%- endcomment -%}
<script>
/* 表示言語: 既定は英語。?lang=ja または保存済みの選択で日本語。描画前に決めて、ちらつきを防ぐ */
(function () {
  var l = '';
  try { l = localStorage.getItem('lang') || ''; } catch (e) {}
  if (/[?&]lang=ja\b/.test(location.search)) l = 'ja';
  if (/[?&]lang=en\b/.test(location.search)) l = 'en';
  document.documentElement.setAttribute('data-lang', l === 'ja' ? 'ja' : 'en');
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FFFFFF; --ink: #111111; --ink2: #666666; --rule: #E6E6E6; --accent: #1F5C3E;
  --s: 13px; --m: 16px; --l: 24px;
  --f: 'Inter', 'Noto Sans JP', -apple-system, 'Hiragino Sans', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--ink); font: 400 var(--m)/1.8 var(--f); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-underline-offset: 3px; }
h1, h2, h3 { font-size: var(--l); font-weight: 700; line-height: 1.4; letter-spacing: -0.01em; }
html:not([data-lang="ja"]) .t-ja { display: none !important; }
html[data-lang="ja"] .t-en { display: none !important; }
small, .s { font-size: var(--s); color: var(--ink2); }
.lead { font-size: var(--l); font-weight: 700; line-height: 1.4; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

.bar { border-bottom: 1px solid var(--rule); }
.bar-in { max-width: 720px; margin: 0 auto; padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.logo { font-weight: 700; font-size: var(--m); color: var(--ink); text-decoration: none; white-space: nowrap; }
.links { display: flex; gap: 20px; list-style: none; margin-left: auto; }
.links a { font-size: var(--s); color: var(--ink2); text-decoration: none; }
.links a:hover { color: var(--ink); }
.links a.current { color: var(--accent); }
.lang-btn { font: inherit; font-size: var(--s); color: var(--ink2); background: none; border: 1px solid var(--rule); border-radius: 4px; padding: 2px 10px; cursor: pointer; }
.lang-btn:hover { color: var(--ink); border-color: var(--ink2); }

.col { max-width: 720px; margin: 0 auto; padding: 0 24px; }
section { padding: 48px 0; border-bottom: 1px solid var(--rule); }
section > * + * { margin-top: 16px; }
section h2 + p, section h1 + p { margin-top: 8px; }

.rows { list-style: none; }
.row { display: grid; grid-template-columns: 96px 1fr; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.row:first-child { border-top: 1px solid var(--rule); }
.row time { font-size: var(--s); color: var(--ink2); padding-top: 3px; }
.row a { color: var(--ink); }
.row a:hover { color: var(--accent); }
.row small { display: block; }
.tabs { display: flex; gap: 20px; }
.tab { font: inherit; font-size: var(--s); color: var(--ink2); background: none; border: 0; border-bottom: 2px solid transparent; padding: 4px 0; cursor: pointer; }
.tab:hover { color: var(--ink); }
.tab.active { color: var(--ink); border-bottom-color: var(--ink); }
.empty { color: var(--ink2); }

.post-meta { font-size: var(--s); color: var(--ink2); }
.tldr { border-left: 2px solid var(--ink); padding-left: 16px; }
.tldr b { font-weight: 700; margin-right: 8px; }
.prose > * + * { margin-top: 1.1em; }
.prose h2 { margin-top: 2em; }
.prose h3 { font-size: var(--m); margin-top: 1.6em; }
.prose ul, .prose ol { padding-left: 1.4em; }
.prose li + li { margin-top: 0.3em; }
.prose blockquote { border-left: 2px solid var(--rule); padding-left: 16px; color: var(--ink2); }
.prose img { max-width: 100%; height: auto; display: block; }
.prose figcaption { font-size: var(--s); color: var(--ink2); margin-top: 6px; }
.prose code { font-family: ui-monospace, Menlo, monospace; font-size: var(--s); background: #F4F4F4; padding: 1px 5px; }
.prose pre { background: #F4F4F4; padding: 14px 16px; overflow-x: auto; }
.prose pre code { background: none; padding: 0; }
.prose table { border-collapse: collapse; width: 100%; font-size: var(--s); display: block; overflow-x: auto; }
.prose th, .prose td { border-bottom: 1px solid var(--rule); padding: 8px 10px; text-align: left; vertical-align: top; }
.prose th { font-weight: 700; }
.prose hr { border: 0; border-top: 1px solid var(--rule); }
.prose .footnotes { font-size: var(--s); color: var(--ink2); }
.pager { display: flex; justify-content: space-between; gap: 16px; font-size: var(--s); }

.embed { border: 1px solid var(--rule); position: relative; width: 100%; padding-bottom: 120%; }
.embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.contact-item + .contact-item { margin-top: 24px; }
.contact-item h3 { font-size: var(--m); }

.foot { max-width: 720px; margin: 0 auto; padding: 24px; display: flex; justify-content: space-between; font-size: var(--s); color: var(--ink2); }
.foot a { color: var(--ink2); }

@media (max-width: 640px) {
  .bar-in, .col { padding-left: 16px; padding-right: 16px; }
  .bar-in { height: auto; flex-wrap: wrap; padding-top: 12px; padding-bottom: 10px; row-gap: 4px; }
  .logo { order: 1; }
  .lang-btn { order: 2; margin-left: auto; }
  .links { order: 3; flex-basis: 100%; margin-left: 0; gap: 16px; flex-wrap: wrap; }
  .row { grid-template-columns: 76px 1fr; gap: 10px; }
  section { padding: 36px 0; }
  .embed { padding-bottom: 150%; }
  .foot { padding: 20px 16px; }
}
</style>
