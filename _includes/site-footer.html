<script>
function toggleLang() {
  var next = document.documentElement.getAttribute('data-lang') === 'ja' ? 'en' : 'ja';
  document.documentElement.setAttribute('data-lang', next);
  try { localStorage.setItem('lang', next); } catch (e) {}
}
</script>
